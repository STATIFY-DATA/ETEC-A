<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Accueil — ETEC_A</title>
<link rel="stylesheet" href="etec.css">
<style>
  main { max-width: 1180px; margin: 0 auto; padding: 26px 24px 40px; display: flex; flex-direction: column; gap: 22px; }
  .salut h1 { margin: 0; font-family: var(--titre); font-weight: 600; font-size: 32px; letter-spacing: -0.02em; line-height: 1.1; }
  .salut p { margin: 6px 0 0; color: var(--gris); font-size: 14.5px; }
  .sync { display: inline-flex; align-items: center; gap: 8px; }
  .point { width: 8px; height: 8px; border-radius: 50%; background: #1F9D7A; box-shadow: 0 0 0 4px #D5EFE6; flex: none; }
  .point.attention { background: var(--orange); box-shadow: 0 0 0 4px var(--orange-doux); }

  .avis { display: flex; flex-direction: column; gap: 10px; }
  .liste-corr { margin: 8px 0 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; }
  .liste-corr li { font-size: 13.5px; }

  .chiffres { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
  .chiffre { background: var(--surface); border: 1px solid var(--bord); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .chiffre .l { font-size: 13px; font-weight: 600; color: var(--gris); }
  .chiffre .v { font-family: var(--titre); font-size: 32px; font-weight: 600; line-height: 1; letter-spacing: -0.02em; }
  .chiffre .v small { font-family: var(--texte); font-size: 14px; font-weight: 500; color: var(--gris); margin-left: 4px; letter-spacing: 0; }
  .piste { height: 6px; border-radius: 99px; background: #E8EBE4; overflow: hidden; }
  .piste i { display: block; height: 100%; border-radius: 99px; background: var(--accent); }

  .section-t { margin: 4px 0 0; font-family: var(--titre); font-weight: 600; font-size: 19px; letter-spacing: -0.01em; }
  .tuiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
  .tuile { position: relative; display: flex; gap: 14px; align-items: flex-start; text-align: left; padding: 18px; border-radius: 16px; border: 1px solid var(--bord); background: var(--surface); color: var(--encre); cursor: pointer; min-height: 96px; width: 100%; }
  .tuile:hover { border-color: #B9C9C2; box-shadow: 0 6px 18px rgba(15, 43, 39, 0.08); }
  .tuile .ic { width: 46px; height: 46px; border-radius: 13px; background: var(--accent-doux); color: var(--accent); display: flex; align-items: center; justify-content: center; flex: none; }
  .tuile .ic svg { width: 22px; height: 22px; }
  .tuile b { display: block; font-size: 15.5px; line-height: 1.3; }
  .tuile span.d { display: block; margin-top: 3px; font-size: 13px; color: var(--gris); line-height: 1.4; }
  .tuile.avec-pastille { padding-right: 52px; }
  .tuile .pastille { position: absolute; top: 14px; right: 14px; min-width: 26px; height: 24px; padding: 0 8px; border-radius: 99px; background: var(--ambre); color: var(--vert-nuit); font-size: 12.5px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; }
  .tuile.principale { grid-column: 1 / -1; background: var(--accent); border-color: var(--accent); color: #FFFFFF; align-items: center; min-height: 88px; }
  .tuile.principale:hover { background: var(--accent-fonce); }
  .tuile.principale .ic { background: rgba(255, 255, 255, 0.16); color: #FFFFFF; }
  .tuile.principale span.d { color: #D5EFE6; }
  .tuile.principale .fleche { margin-left: auto; width: 24px; height: 24px; flex: none; }


  @media (max-width: 640px) {
    main { padding: 18px 16px 28px; gap: 18px; }
    .salut h1 { font-size: 25px; }
    .chiffres { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .chiffre .v { font-size: 27px; }
    .tuiles { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<header class="barre">
  <div class="barre-int">
    <div class="marque">
      <div class="logo">EA</div>
      <div><b>ETEC_A</b><span>Collecte et suivi de la qualité</span></div>
    </div>
    <div class="agent">
      <div class="av" id="initiales">—</div>
      <div><b id="agent-nom">—</b><span id="agent-role">—</span></div>
    </div>
    <button type="button" class="btn-sortie" data-choix="98">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5M17 8h5M19.5 5.5 22 8l-2.5 2.5"/></svg>
      Changer d'agent
    </button>
    <button type="button" class="btn-sortie" data-choix="5">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 4h4a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1h-4M10 16l4-4-4-4M14 12H4"/></svg>
      Quitter
    </button>
  </div>
</header>

<main>
  <section class="salut">
    <h1 id="bonjour">Bonjour</h1>
    <p><span id="perimetre"></span> · <span class="sync"><span class="point" id="point-sync"></span><span id="sync"></span></span></p>
  </section>

  <section class="avis" id="avis" aria-live="polite"></section>

  <section class="chiffres" id="chiffres" aria-label="Chiffres clés"></section>

  <section>
    <h2 class="section-t">Que voulez-vous faire ?</h2>
  </section>
  <section class="tuiles" id="tuiles"></section>
</main>

<footer>
  <span id="pied">Écrans modernes · ETEC_A V1</span>
  <button type="button" class="lien" data-choix="99">Passer aux écrans classiques</button>
</footer>

<script src="/action-invoker.js"></script>
<script src="etec.js"></script>
<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var h = ETEC.html;

  /* Données d'exemple pour l'aperçu hors de CSPro */
  var EXEMPLE = {
    agent: "CTR001", nom: "", role: 2, roleLibelle: "Contrôleur", perimetre: "Mon équipe",
    assignees: 49, visites: 43, enCours: 5, termines: 9, valides: 26, approuves: 0, aCorriger: 3, rejetes: 0,
    upiValidees: 24, aControler: 9, aApprouver: 0, nouvelles: 2, derniereSync: "08/10/2026 20:45", listeACorriger: []
  };
  var d = ETEC.donnees();
  if (!d || typeof d !== "object") { d = EXEMPLE; ETEC.apercu(); }

  var ICONES = {
    collecter: '<path d="M9 3h6l1 3h3a1 1 0 0 1 1 1v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7a1 1 0 0 1 1-1h3l1-3z"/><path d="M12 10v6M9 13h6"/>',
    assignations: '<path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/>',
    bilan: '<path d="M3 21h18M6 17v-6M11 17V5M16 17V9"/>',
    sync: '<path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/>',
    diag: '<path d="M3 12h4l2-6 4 12 2-6h6"/>',
    journal: '<path d="M8 6h13M8 12h13M8 18h13M3.5 6h.5M3.5 12h.5M3.5 18h.5"/>',
    derogation: '<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 7.5-2"/>',
    controle: '<circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.7 2.7L16 10"/>',
    gestion: '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5M16 4.5a3.5 3.5 0 0 1 0 7M18 14.6c1.9.7 3.1 2.6 3.5 5.4"/>'
  };
  function icone(nom) {
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + ICONES[nom] + '</svg>';
  }
  /* Largeur exacte des barres (le texte du pourcentage vient de la logique : TEXTE_POURCENT) */
  function pct(n, t) { return t > 0 ? Math.min(100, 100 * n / t) : 0; }
  function n(v) { var x = Number(v); return isFinite(x) ? x : 0; }

  var role = n(d.role);

  /* En-tête : l'agent est désigné par son code (SUP001, CTR001, ENQ001…), jamais par le nom enregistré dans le compte */
  var code = String(d.agent || "").trim().toUpperCase();
  $("initiales").textContent = code.slice(0, 2) || "EU";
  $("agent-nom").textContent = code || "—";
  $("agent-role").textContent = d.roleLibelle || "";

  /* Salutation selon l'heure de l'appareil : avant 12h Bonjour, de 12h à 17h59 Bon après-midi, de 18h à 4h59 Bonsoir */
  function salutation(heure) {
    if (heure >= 5 && heure < 12) return "Bonjour";
    if (heure >= 12 && heure < 18) return "Bon après-midi";
    return "Bonsoir";
  }
  var maintenant = new Date();
  $("bonjour").textContent = salutation(maintenant.getHours()) + (code ? ", " + code : "");
  $("perimetre").textContent = d.perimetre || "";
  var jamais = /aucune/i.test(d.derniereSync || "");
  $("sync").textContent = jamais ? "Aucune synchronisation réussie" : "Dernière synchronisation réussie : " + (d.derniereSync || "—");
  $("point-sync").classList.toggle("attention", jamais);

  /* Avis */
  var avis = [];
  /* Étape 4b : résultat de la synchronisation automatique du jour */
  if (d.syncAuto && typeof d.syncAuto === "object" && d.syncAuto.message) {
    avis.push('<div class="message ' + (d.syncAuto.etat === "OK" ? 'message-ok' : 'message-erreur') + '">' + icone("sync") + '<span>' + h(d.syncAuto.message) + '</span></div>');
  }
  /* Étape 4b : plus de 2 jours sans synchronisation réussie */
  var jss = Number(d.joursSansSync);
  if (d.joursSansSync !== undefined && d.joursSansSync !== null && isFinite(jss) && (jss > 2 || jss === -1)) {
    avis.push('<div class="message message-erreur">' + icone("sync") + '<span>' + (jss === -1
      ? '<b>Aucune synchronisation réussie sur cet appareil.</b> Synchronisez dès que possible.'
      : '<b>Votre dernière synchronisation réussie date du ' + h(d.derniereSync) + ' (' + jss + ' jours).</b> Synchronisez dès que possible.') + '</span></div>');
  }
  if (n(d.nouvelles) > 0) {
    avis.push('<div class="message message-info">' + icone("assignations") + '<span>Vous avez reçu <b>' + n(d.nouvelles) + '</b> nouvelle' + (n(d.nouvelles) > 1 ? 's ' : ' ') + (role === 1 ? 'structure' : 'zone') + (n(d.nouvelles) > 1 ? 's' : '') + '. Consultez « Voir mes assignations ».</span></div>');
  }
  var corr = Array.isArray(d.listeACorriger) ? d.listeACorriger : [];
  if (role === 1 && corr.length > 0) {
    var lignes = corr.map(function (q) {
      return '<li><span class="code">' + h(q.grappe) + '-' + h(q.upi) + '-' + h(q.repondant) + '</span> ' + (q.code ? '<b>' + h(q.code) + '</b> · ' : '') + h(q.motif) + '</li>';
    }).join("");
    avis.push('<div class="message message-erreur">' + icone("controle") + '<div><b>' + corr.length + ' questionnaire' + (corr.length > 1 ? 's renvoyés' : ' renvoyé') + ' pour correction.</b> Ouvrez-les avec « Collecter / Modifier un questionnaire ».<ul class="liste-corr">' + lignes + '</ul></div></div>');
  }
  if ((role === 2 || role === 3) && n(d.aControler) > 0) {
    avis.push('<div class="message message-info">' + icone("controle") + '<span><b>' + n(d.aControler) + '</b> questionnaire' + (n(d.aControler) > 1 ? 's terminés attendent' : ' terminé attend') + ' votre contrôle.</span></div>');
  }
  if ((role === 3 || role === 4) && n(d.aApprouver) > 0) {
    avis.push('<div class="message message-info">' + icone("controle") + '<span><b>' + n(d.aApprouver) + '</b> questionnaire' + (n(d.aApprouver) > 1 ? 's validés attendent' : ' validé attend') + ' votre approbation.</span></div>');
  }
  $("avis").innerHTML = avis.join("");
  $("avis").classList.toggle("cache", avis.length === 0);

  /* Chiffres clés */
  var assign = n(d.assignees), uv = n(d.upiValidees);
  var ch = [];
  ch.push('<div class="chiffre"><div class="l">' + (role === 1 ? 'Structures assignées' : 'Structures assignées') + '</div><div class="v">' + assign + '</div></div>');
  ch.push('<div class="chiffre"><div class="l">Structures validées</div><div class="v">' + uv + '<small>' + h(d.avancementTxt !== undefined ? d.avancementTxt : (pct(uv, assign).toFixed(2) + ' %').replace('.', ',')) + '</small></div><div class="piste"><i style="width:' + pct(uv, assign) + '%"></i></div></div>');
  if (role === 1) {
    var reste = Math.max(0, assign - n(d.visites));
    ch.push('<div class="chiffre"><div class="l">Questionnaires en cours</div><div class="v">' + n(d.enCours) + '</div></div>');
    ch.push('<div class="chiffre"><div class="l">Structures pas encore commencées</div><div class="v">' + reste + '</div></div>');
    ch.push('<div class="chiffre"><div class="l">À corriger</div><div class="v"' + (n(d.aCorriger) > 0 ? ' style="color:var(--orange)"' : '') + '>' + n(d.aCorriger) + '</div></div>');
  } else {
    ch.push('<div class="chiffre"><div class="l">Questionnaires terminés</div><div class="v">' + n(d.termines) + '<small>à contrôler</small></div></div>');
    ch.push('<div class="chiffre"><div class="l">Questionnaires validés</div><div class="v">' + n(d.valides) + '<small>dont ' + n(d.approuves) + ' approuvés</small></div></div>');
    ch.push('<div class="chiffre"><div class="l">Renvoyés pour correction</div><div class="v"' + (n(d.aCorriger) > 0 ? ' style="color:var(--orange)"' : '') + '>' + n(d.aCorriger) + '</div></div>');
  }
  $("chiffres").innerHTML = ch.join("");

  /* Tuiles : mêmes options et mêmes droits que le menu classique */
  var tuiles = [];
  tuiles.push({ c: 1, ic: "collecter", t: "Collecter / Modifier un questionnaire", d: "Ouvrir le questionnaire d'une structure", principale: true });
  tuiles.push({ c: 2, ic: "assignations", t: "Voir mes assignations", d: role === 1 ? "Mes structures et leur état" : role === 2 ? "Les zones et les structures de mon équipe" : "Les assignations de mon périmètre" });
  tuiles.push({ c: 3, ic: "bilan", t: "Suivi / Bilan", d: role === 1 ? "Mon bilan en chiffres" : "Bilans, graphiques et classement" });
  tuiles.push({ c: 4, ic: "sync", t: "Synchroniser", d: "Envoyer et recevoir les données" });
  if (role >= 2) tuiles.push({ c: 8, ic: "controle", t: "Contrôle qualité", d: role === 4 ? "Questionnaires validés à approuver" : role === 3 ? "Contrôler et approuver les questionnaires" : "Valider, renvoyer ou rejeter les questionnaires", badge: role === 2 ? n(d.aControler) : role === 4 ? n(d.aApprouver) : n(d.aControler) + n(d.aApprouver) });
  if (role === 2 || role === 3) tuiles.push({ c: 9, ic: "gestion", t: role === 3 ? "Assignations et comptes" : "Gérer les assignations", d: role === 3 ? "Zones, structures et comptes des agents" : "Assigner ou retirer des structures" });
  if (role === 2 || role === 3) tuiles.push({ c: 7, ic: "derogation", t: "Dérogations et déblocages", d: "Accès exceptionnels, zones et comptes verrouillés" });
  if (role >= 2) tuiles.push({ c: 6, ic: "journal", t: "Journal", d: "Synchronisations et événements" });
  tuiles.push({ c: 10, ic: "diag", t: "Vérifier mon installation", d: "Version, serveur, données et réglages de cet appareil" });

  $("tuiles").innerHTML = tuiles.map(function (t) {
    return '<button type="button" class="tuile' + (t.principale ? ' principale' : '') + (t.badge > 0 ? ' avec-pastille' : '') + '" data-choix="' + t.c + '">' +
      '<span class="ic">' + icone(t.ic) + '</span>' +
      '<span><b>' + h(t.t) + '</b><span class="d">' + h(t.d) + '</span></span>' +
      (t.principale ? '<svg class="fleche" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>' : '') +
      (t.badge > 0 ? '<span class="pastille" aria-label="' + t.badge + ' en attente">' + t.badge + '</span>' : '') +
      '</button>';
  }).join("");

  /* Un seul choix est renvoyé à l'application */
  var envoye = false;
  document.addEventListener("click", function (e) {
    var el = e.target.closest ? e.target.closest("[data-choix]") : null;
    if (!el || envoye) return;
    envoye = ETEC.dansCSPro();
    ETEC.fermer(el.getAttribute("data-choix"));
  });

  var premiere = document.querySelector(".tuile.principale");
  if (premiere) { try { premiere.focus({ preventScroll: true }); } catch (e) { premiere.focus(); } }
})();
</script>
</body>
</html>
